<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7c86">
<title>printer-web</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="qr.css">
</head>
<body class="qrpage">
<main class="qrwrap">
  <div class="tools noprint">
    <a class="btn" href="./" data-i18n="qr_back"></a>
  </div>

  <article class="poster" id="poster">
    <div class="mark" aria-hidden="true"><i class="c"></i><i class="m"></i><i class="y"></i><i class="k"></i></div>
    <h1 id="pname">printer-web</h1>
    <p class="loc" id="ploc"></p>
    <div class="qrbox" id="qr" data-i18n-aria="qr_aria"></div>
    <p class="url" id="addr"></p>
    <p class="scan" data-i18n="qr_scan"></p>
  </article>

  <div class="tools noprint">
    <button type="button" class="print" id="labelBtn" data-i18n="qr_print_label"></button>
    <button type="button" class="btn" id="posterBtn" data-i18n="qr_print_poster"></button>
    <button type="button" class="btn" id="browserBtn" data-i18n="qr_print_browser"></button>
    <p class="hint" id="msg" role="status" aria-live="polite" data-i18n="qr_hint"></p>
    <div class="notice" id="err" role="alert" hidden></div>
  </div>
</main>
<script src="vendor/qrcode.min.js"></script>
<script src="i18n.js"></script>
<script src="qr.js"></script>
</body>
</html>
